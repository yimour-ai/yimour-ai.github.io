name: تحديث أخبار الذكاء الاصطناعي

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تجهيز Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: تثبيت feedparser
        run: |
          python -m pip install --upgrade pip
          python -m pip install feedparser

      - name: تشغيل سكريبت الأخبار
        run: python3 generate_news.py

      - name: حفظ ورفع التغييرات
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"

          git add news.html

          if git diff --staged --quiet; then
            echo "لا توجد تغييرات في الأخبار."
          else
            git commit -m "تحديث تلقائي للأخبار"
            git push
          fi
