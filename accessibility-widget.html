     أداة إمكانية الوصول
     خفيفة ومتجاوبة مع الهاتف
     ========================= --><div class="accessibility-widget" id="accessibilityWidget">  <!-- زر فتح الأداة --><button
type="button"
class="accessibility-toggle"
id="accessibilityToggle"
aria-label="فتح خيارات إمكانية الوصول"
aria-expanded="false"
aria-controls="accessibilityPanel">
♿
</button>

  <!-- لوحة الخيارات -->  <div
    class="accessibility-panel"
    id="accessibilityPanel"
    hidden
    aria-label="خيارات إمكانية الوصول"><div class="accessibility-title">
  <span>إمكانية الوصول</span>

  <button
    type="button"
    class="accessibility-close"
    id="accessibilityClose"
    aria-label="إغلاق خيارات إمكانية الوصول">
    ×
  </button>
</div>

<div class="accessibility-buttons">

  <button
    type="button"
    id="fontIncrease"
    aria-label="تكبير حجم النص">
    A+
  </button>

  <button
    type="button"
    id="fontDecrease"
    aria-label="تصغير حجم النص">
    A−
  </button>

  <button
    type="button"
    id="grayscaleToggle"
    aria-label="تفعيل الأبيض والأسود"
    aria-pressed="false">
    ⚫ أبيض وأسود
  </button>

  <button
    type="button"
    id="contrastToggle"
    aria-label="تفعيل التباين العالي"
    aria-pressed="false">
    ◐ تباين عالٍ
  </button>

  <button
    type="button"
    id="speechToggle"
    aria-label="قراءة محتوى الصفحة">
    🔊 قراءة الصفحة
  </button>

  <button
    type="button"
    id="accessibilityReset"
    aria-label="إعادة إعدادات إمكانية الوصول">
    ↺ إعادة الضبط
  </button>

  </div>
</div><style>
/* =========================
   Accessibility Widget
   ========================= */

.accessibility-widget {
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 9999;
  font-family: Arial, sans-serif;
}

/* زر ♿ الرئيسي */
.accessibility-toggle {
  width: 50px;
  height: 50px;
  border: 0;
  border-radius: 50%;
  background: #2563eb;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,.20);
  transition: transform .2s ease;
}

.accessibility-toggle:hover {
  transform: scale(1.05);
}

.accessibility-toggle:focus-visible,
.accessibility-panel button:focus-visible {
  outline: 3px solid #f59e0b;
  outline-offset: 2px;
}

/* لوحة الخيارات */
.accessibility-panel {
  position: absolute;
  left: 0;
  bottom: 60px;
  width: 260px;
  background: #fff;
  color: #111;
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.18);
}

/* عنوان اللوحة */
.accessibility-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 16px;
  font-weight: bold;
}

.accessibility-close {
  width: 30px !important;
  min-width: 30px !important;
  height: 30px;
  padding: 0 !important;
  border-radius: 50% !important;
  font-size: 20px !important;
}

/* الأزرار */
.accessibility-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.accessibility-buttons button {
  min-height: 42px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #f8fafc;
  color: #111827;
  padding: 7px 6px;
  font-size: 13px;
  cursor: pointer;
  transition: background .2s ease, transform .15s ease;
}

.accessibility-buttons button:hover {
  background: #e5e7eb;
}

.accessibility-buttons button:active {
  transform: scale(.97);
}

/* =========================
   الوضع عالي التباين
   ========================= */

body.accessibility-high-contrast {
  background: #000 !important;
  color: #fff !important;
}

body.accessibility-high-contrast header,
body.accessibility-high-contrast nav,
body.accessibility-high-contrast main,
body.accessibility-high-contrast section,
body.accessibility-high-contrast article,
body.accessibility-high-contrast footer,
body.accessibility-high-contrast .card {
  background: #000 !important;
  color: #fff !important;
}

body.accessibility-high-contrast a {
  color: #00ffff !important;
  text-decoration: underline !important;
}

body.accessibility-high-contrast button {
  background: #000 !important;
  color: #fff !important;
  border-color: #fff !important;
}

/* =========================
   التدرج الرمادي
   ========================= */

html.accessibility-grayscale {
  filter: grayscale(100%);
}

/* =========================
   تحسين الهاتف
   ========================= */

@media (max-width: 600px) {

  .accessibility-widget {
    left: 10px;
    bottom: 10px;
  }

  .accessibility-toggle {
    width: 46px;
    height: 46px;
    font-size: 21px;
  }

  .accessibility-panel {
    width: min(260px, calc(100vw - 30px));
    bottom: 55px;
  }

  .accessibility-buttons button {
    font-size: 12px;
  }
}

/* احترام إعداد تقليل الحركة */
@media (prefers-reduced-motion: reduce) {

  .accessibility-toggle,
  .accessibility-buttons button {
    transition: none;
  }
}
</style><script>
(function () {

  "use strict";

  const body = document.body;
  const html = document.documentElement;

  const toggle = document.getElementById("accessibilityToggle");
  const panel = document.getElementById("accessibilityPanel");
  const close = document.getElementById("accessibilityClose");

  const increase = document.getElementById("fontIncrease");
  const decrease = document.getElementById("fontDecrease");

  const grayscale = document.getElementById("grayscaleToggle");
  const contrast = document.getElementById("contrastToggle");

  const speech = document.getElementById("speechToggle");
  const reset = document.getElementById("accessibilityReset");

  const STORAGE_KEY = "siteAccessibilitySettings";

  let fontLevel = 0;

  /* فتح وإغلاق اللوحة */
  function openPanel() {
    panel.hidden = false;
    toggle.setAttribute("aria-expanded", "true");
  }

  function closePanel() {
    panel.hidden = true;
    toggle.setAttribute("aria-expanded", "false");
  }

  toggle.addEventListener("click", function () {
    if (panel.hidden) {
      openPanel();
    } else {
      closePanel();
    }
  });

  close.addEventListener("click", closePanel);


  /* =========================
     حجم الخط
     ========================= */

  function applyFontSize() {

    const sizes = [
      "100%",
      "110%",
      "120%",
      "130%",
      "140%"
    ];

    body.style.fontSize = sizes[fontLevel];

  }

  increase.addEventListener("click", function () {

    if (fontLevel < 4) {
      fontLevel++;
      applyFontSize();
      saveSettings();
    }

  });

  decrease.addEventListener("click", function () {

    if (fontLevel > 0) {
      fontLevel--;
      applyFontSize();
      saveSettings();
    }

  });


  /* =========================
     الأبيض والأسود
     ========================= */

  grayscale.addEventListener("click", function () {

    html.classList.toggle("accessibility-grayscale");

    const active =
      html.classList.contains("accessibility-grayscale");

    grayscale.setAttribute("aria-pressed", active);

    saveSettings();

  });


  /* =========================
     التباين العالي
     ========================= */

  contrast.addEventListener("click", function () {

    body.classList.toggle("accessibility-high-contrast");

    const active =
      body.classList.contains("accessibility-high-contrast");

    contrast.setAttribute("aria-pressed", active);

    saveSettings();

  });


  /* =========================
     القراءة الصوتية
     ========================= */

  speech.addEventListener("click", function () {

    if (!("speechSynthesis" in window)) {

      alert("متصفحك لا يدعم القراءة الصوتية.");

      return;
    }

    /* إذا كانت القراءة تعمل → إيقاف */
    if (window.speechSynthesis.speaking) {

      window.speechSynthesis.cancel();

      speech.textContent = "🔊 قراءة الصفحة";

      return;
    }

    /*
      نفضل قراءة المقال فقط.
      وإذا لم يوجد article نقرأ المحتوى الرئيسي.
    */

    const article = document.querySelector("article");
    const main = document.querySelector("main");

    const source = article || main;

    if (!source) {

      alert("لم يتم العثور على محتوى مناسب للقراءة.");

      return;
    }

    const text = source.innerText.trim();

    if (!text) {

      alert("لا يوجد نص متاح للقراءة.");

      return;
    }

    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "ar-SA";
    utterance.rate = 0.9;
    utterance.pitch = 1;

    utterance.onstart = function () {
      speech.textContent = "⏹ إيقاف القراءة";
    };

    utterance.onend = function () {
      speech.textContent = "🔊 قراءة الصفحة";
    };

    utterance.onerror = function () {
      speech.textContent = "🔊 قراءة الصفحة";
    };

    window.speechSynthesis.speak(utterance);

  });


  /* =========================
     حفظ الإعدادات
     ========================= */

  function saveSettings() {

    try {

      const settings = {

        fontLevel: fontLevel,

        grayscale:
          html.classList.contains("accessibility-grayscale"),

        contrast:
          body.classList.contains("accessibility-high-contrast")

      };

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(settings)
      );

    } catch (error) {
      /* تجاهل الخطأ إذا كان التخزين غير متاح */
    }

  }


  /* =========================
     تحميل الإعدادات
     ========================= */

  function loadSettings() {

    try {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) return;

      const settings =
        JSON.parse(saved);

      if (
        typeof settings.fontLevel === "number" &&
        settings.fontLevel >= 0 &&
        settings.fontLevel <= 4
      ) {

        fontLevel = settings.fontLevel;
        applyFontSize();

      }

      if (settings.grayscale) {

        html.classList.add(
          "accessibility-grayscale"
        );

        grayscale.setAttribute(
          "aria-pressed",
          "true"
        );

      }

      if (settings.contrast) {

        body.classList.add(
          "accessibility-high-contrast"
        );

        contrast.setAttribute(
          "aria-pressed",
          "true"
        );

      }

    } catch (error) {
      /* تجاهل البيانات التالفة */
    }

  }


  /* =========================
     إعادة الإعدادات
     ========================= */

  reset.addEventListener("click", function () {

    fontLevel = 0;

    body.style.fontSize = "";

    html.classList.remove(
      "accessibility-grayscale"
    );

    body.classList.remove(
      "accessibility-high-contrast"
    );

    grayscale.setAttribute(
      "aria-pressed",
      "false"
    );

    contrast.setAttribute(
      "aria-pressed",
      "false"
    );

    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }

    speech.textContent = "🔊 قراءة الصفحة";

    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (error) {}

  });


  /* إغلاق اللوحة عند الضغط خارجها */
  document.addEventListener("click", function (event) {

    if (
      !document.getElementById(
        "accessibilityWidget"
      ).contains(event.target)
    ) {

      closePanel();

    }

  });


  /* زر Escape لإغلاق اللوحة */
  document.addEventListener("keydown", function (event) {

    if (event.key === "Escape") {
      closePanel();
    }

  });


  /* تشغيل الإعدادات المحفوظة */
  loadSettings();

})();
</script>
