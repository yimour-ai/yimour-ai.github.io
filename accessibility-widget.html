<!-- Accessibility Widget - Yimour AI -->
<div id="accessibility-widget" class="accessibility-widget" dir="rtl" aria-label="أداة إمكانية الوصول">

  <button
    type="button"
    class="accessibility-toggle"
    id="accessibility-toggle"
    aria-expanded="false"
    aria-controls="accessibility-panel"
    aria-label="فتح أدوات إمكانية الوصول">
    ♿
  </button>

  <div id="accessibility-panel" class="accessibility-panel" hidden>

    <div class="accessibility-title">
      <span>إمكانية الوصول</span>

      <button
        type="button"
        class="accessibility-close"
        id="accessibility-close"
        aria-label="إغلاق أدوات إمكانية الوصول">
        ×
      </button>
    </div>

    <div class="accessibility-buttons">

      <button
        type="button"
        id="font-increase"
        aria-label="تكبير الخط">
        A+
      </button>

      <button
        type="button"
        id="font-decrease"
        aria-label="تصغير الخط">
        A-
      </button>

      <button
        type="button"
        id="grayscale-toggle"
        aria-label="تفعيل الأبيض والأسود">
        ⚫⚪ أبيض وأسود
      </button>

      <button
        type="button"
        id="contrast-toggle"
        aria-label="تفعيل التباين العالي">
        ◐ تباين عالٍ
      </button>

      <button
        type="button"
        id="read-toggle"
        aria-label="قراءة المقال">
        🔊 قراءة المقال
      </button>

      <button
        type="button"
        id="reset-accessibility"
        aria-label="إعادة ضبط إعدادات إمكانية الوصول">
        ↺ إعادة الضبط
      </button>

    </div>

    <div
      class="accessibility-status"
      id="accessibility-status"
      aria-live="polite">
    </div>

  </div>
</div>
