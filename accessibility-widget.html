/* ==============================
   Accessibility Widget
   Yimour AI
   ============================== */

.accessibility-widget {
  position: fixed;
  left: 16px;
  bottom: 85px;
  z-index: 99999;
  font-family: Arial, sans-serif;
}

/* زر فتح الأداة */
.accessibility-toggle {
  width: 48px;
  height: 48px;
  border: 1px solid #ccc;
  border-radius: 50%;
  background: #fff;
  color: #111;
  font-size: 23px;
  cursor: pointer;
  box-shadow: 0 4px 12px rgba(0,0,0,.18);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s ease, box-shadow .2s ease;
}

.accessibility-toggle:hover,
.accessibility-toggle:focus {
  transform: scale(1.05);
  box-shadow: 0 5px 15px rgba(0,0,0,.25);
  outline: 3px solid rgba(0,123,255,.25);
}

/* لوحة الأدوات */
.accessibility-panel {
  width: 230px;
  margin-bottom: 10px;
  padding: 12px;
  background: #fff;
  color: #111;
  border: 1px solid #ccc;
  border-radius: 12px;
  box-shadow: 0 6px 20px rgba(0,0,0,.2);
}

/* عنوان الأداة */
.accessibility-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-weight: bold;
  font-size: 15px;
  margin-bottom: 10px;
  padding-bottom: 8px;
  border-bottom: 1px solid #ddd;
}

.accessibility-close {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #333;
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
}

.accessibility-close:hover,
.accessibility-close:focus {
  background: #eee;
}

/* الأزرار */
.accessibility-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.accessibility-buttons button {
  min-height: 38px;
  padding: 6px 7px;
  border: 1px solid #ccc;
  border-radius: 7px;
  background: #f7f7f7;
  color: #111;
  font-size: 13px;
  cursor: pointer;
  transition: background .2s ease, transform .1s ease;
}

.accessibility-buttons button:hover,
.accessibility-buttons button:focus {
  background: #e9e9e9;
  outline: 2px solid rgba(0,123,255,.25);
}

.accessibility-buttons button:active {
  transform: scale(.97);
}

/* حالة الأداة */
.accessibility-status {
  min-height: 18px;
  margin-top: 8px;
  text-align: center;
  font-size: 12px;
  color: #555;
}

/* ==============================
   High Contrast
   ============================== */

body.high-contrast {
  background: #000 !important;
  color: #fff !important;
}

body.high-contrast a {
  color: #00ffff !important;
}

body.high-contrast button,
body.high-contrast input,
body.high-contrast textarea,
body.high-contrast select {
  background: #000 !important;
  color: #fff !important;
  border-color: #fff !important;
}

body.high-contrast header,
body.high-contrast nav,
body.high-contrast footer,
body.high-contrast section,
body.high-contrast article,
body.high-contrast .card,
body.high-contrast .container {
  background: #000 !important;
  color: #fff !important;
  border-color: #fff !important;
}

/* ==============================
   Grayscale
   ============================== */

body.accessibility-grayscale {
  filter: grayscale(100%);
}

/* لا نطبق التأثير على أداة إمكانية الوصول نفسها */
.accessibility-widget {
  filter: none !important;
}


/* ==============================
   Mobile
   ============================== */

@media (max-width: 480px) {

  .accessibility-widget {
    left: 12px;
    bottom: 80px;
  }

  .accessibility-toggle {
    width: 46px;
    height: 46px;
    font-size: 21px;
  }

  .accessibility-panel {
    width: min(230px, calc(100vw - 32px));
  }

  .accessibility-buttons button {
    font-size: 12px;
  }
}


/* احترام إعداد تقليل الحركة */
@media (prefers-reduced-motion: reduce) {

  .accessibility-toggle,
  .accessibility-buttons button {
    transition: none;
  }
}
</style><script>
(function () {
  "use strict";

  /* ==============================
     إعدادات
     ============================== */

  const STORAGE_KEY = "yimourAccessibilitySettings";

  const DEFAULT_SETTINGS = {
    fontSize: 100,
    grayscale: false,
    contrast: false
  };

  let settings = loadSettings();
  let speechActive = false;


  /* ==============================
     العناصر
     ============================== */

  const widget = document.getElementById("accessibility-widget");
  const toggleButton = document.getElementById("accessibility-toggle");
  const panel = document.getElementById("accessibility-panel");
  const closeButton = document.getElementById("accessibility-close");

  const fontIncrease = document.getElementById("font-increase");
  const fontDecrease = document.getElementById("font-decrease");

  const grayscaleToggle = document.getElementById("grayscale-toggle");
  const contrastToggle = document.getElementById("contrast-toggle");

  const readToggle = document.getElementById("read-toggle");
  const resetButton = document.getElementById("reset-accessibility");

  const status = document.getElementById("accessibility-status");


  /* ==============================
     فتح وإغلاق الأداة
     ============================== */

  toggleButton.addEventListener("click", function () {

    const isOpen = !panel.hidden;

    panel.hidden = isOpen;

    toggleButton.setAttribute(
      "aria-expanded",
      String(!isOpen)
    );
  });


  closeButton.addEventListener("click", function () {

    panel.hidden = true;

    toggleButton.setAttribute(
      "aria-expanded",
      "false"
    );

    toggleButton.focus();
  });


  /* ==============================
     حجم الخط
     ============================== */

  fontIncrease.addEventListener("click", function () {

    if (settings.fontSize < 150) {
      settings.fontSize += 10;
      applySettings();
      saveSettings();

      showStatus("تم تكبير الخط");
    }
  });


  fontDecrease.addEventListener("click", function () {

    if (settings.fontSize > 80) {
      settings.fontSize -= 10;
      applySettings();
      saveSettings();

      showStatus("تم تصغير الخط");
    }
  });


  /* ==============================
     الأبيض والأسود
     ============================== */

  grayscaleToggle.addEventListener("click", function () {

    settings.grayscale = !settings.grayscale;

    applySettings();
    saveSettings();

    showStatus(
      settings.grayscale
        ? "تم تفعيل الأبيض والأسود"
        : "تم إيقاف الأبيض والأسود"
    );
  });


  /* ==============================
     التباين العالي
     ============================== */

  contrastToggle.addEventListener("click", function () {

    settings.contrast = !settings.contrast;

    applySettings();
    saveSettings();

    showStatus(
      settings.contrast
        ? "تم تفعيل التباين العالي"
        : "تم إيقاف التباين العالي"
    );
  });


  /* ==============================
     القراءة الصوتية
     ============================== */

  readToggle.addEventListener("click", function () {

    if (!("speechSynthesis" in window)) {

      showStatus("متصفحك لا يدعم القراءة الصوتية");

      return;
    }


    /* إيقاف القراءة */
    if (speechActive || speechSynthesis.speaking) {

      speechSynthesis.cancel();

      speechActive = false;

      readToggle.textContent = "🔊 قراءة المقال";

      showStatus("تم إيقاف القراءة");

      return;
    }


    /* العثور على المقال */
    const article =
      document.querySelector("article") ||
      document.querySelector(".article-content") ||
      document.querySelector(".post-content") ||
      document.querySelector("main");


    if (!article) {

      showStatus("لم يتم العثور على محتوى المقال");

      return;
    }


    const text = article.innerText.trim();


    if (!text) {

      showStatus("لا يوجد نص لقراءته");

      return;
    }


    /* إنشاء القراءة */
    const utterance =
      new SpeechSynthesisUtterance(text);

    utterance.lang = "ar-SA";
    utterance.rate = 0.9;
    utterance.pitch = 1;
    utterance.volume = 1;


    utterance.onstart = function () {

      speechActive = true;

      readToggle.textContent = "⏹ إيقاف القراءة";

      showStatus("جاري قراءة المقال...");
    };


    utterance.onend = function () {

      speechActive = false;

      readToggle.textContent = "🔊 قراءة المقال";

      showStatus("انتهت قراءة المقال");
    };


    utterance.onerror = function () {

      speechActive = false;

      readToggle.textContent = "🔊 قراءة المقال";

      showStatus("تعذر تشغيل القراءة الصوتية");
    };


    speechSynthesis.cancel();

    speechSynthesis.speak(utterance);

  });


  /* ==============================
     إعادة الضبط
     ============================== */

  resetButton.addEventListener("click", function () {

    speechSynthesis.cancel();

    speechActive = false;

    settings = {
      ...DEFAULT_SETTINGS
    };

    applySettings();
    saveSettings();

    readToggle.textContent = "🔊 قراءة المقال";

    showStatus("تمت إعادة إعدادات إمكانية الوصول");

  });


  /* ==============================
     تطبيق الإعدادات
     ============================== */

  function applySettings() {

    /*
     * نستخدم CSS variable بدل تغيير
     * حجم body مباشرة حتى لا تتأثر
     * أداة إمكانية الوصول نفسها.
     */

    document.documentElement.style.setProperty(
      "--accessibility-font-scale",
      settings.fontSize / 100
    );


    document.body.style.fontSize =
      settings.fontSize + "%";


    document.body.classList.toggle(
      "accessibility-grayscale",
      settings.grayscale
    );


    document.body.classList.toggle(
      "high-contrast",
      settings.contrast
    );

  }


  /* ==============================
     حفظ الإعدادات
     ============================== */

  function saveSettings() {

    try {

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(settings)
      );

    } catch (error) {

      /* تجاهل الخطأ إذا كان localStorage غير متاح */

    }
  }


  /* ==============================
     تحميل الإعدادات
     ============================== */

  function loadSettings() {

    try {

      const saved =
        localStorage.getItem(STORAGE_KEY);

      if (!saved) {
        return {
          ...DEFAULT_SETTINGS
        };
      }


      const parsed = JSON.parse(saved);

      return {
        ...DEFAULT_SETTINGS,
        ...parsed
      };

    } catch (error) {

      return {
        ...DEFAULT_SETTINGS
      };
    }
  }


  /* ==============================
     رسالة الحالة
     ============================== */

  function showStatus(message) {

    status.textContent = message;

    clearTimeout(showStatus.timer);

    showStatus.timer = setTimeout(function () {

      status.textContent = "";

    }, 2500);

  }


  /* ==============================
     تطبيق الإعدادات عند التحميل
     ============================== */

  applySettings();


  /* ==============================
     إيقاف القراءة عند مغادرة الصفحة
     ============================== */

  window.addEventListener("beforeunload", function () {

    if ("speechSynthesis" in window) {
      speechSynthesis.cancel();
    }

  });


})();
</script>
